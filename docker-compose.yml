services:
  netwatch:
    build: .
    container_name: netwatch
    # Network Mode:
    # - "host": Recommended for Linux. Allows scanning the host network (L2) to get MAC addresses.
    # - "bridge": Default. Works for L3 scanning (IPs only) or if you only need to scan other containers.
    #             Windows/Mac users typically must use bridge mode due to Docker desktop limitations.
    # network_mode: host
    ports:
      - "8787:8787"
    restart: unless-stopped
    volumes:
      - ./config.json:/app/config.json
      - ./data:/app/data
    # Grant capability for raw socket operations (required for nmap/arp-scan)
    cap_add:
      - NET_ADMIN
      - NET_RAW
